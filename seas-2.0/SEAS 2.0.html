<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>SEAS 2.0 — Statistical Enrichment Analysis of Samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;
    --surface:#ffffff;
    --surface-2:#fbfaf7;
    --surface-strong:#ffffff;
    --ink:#171715;
    --ink-solid:#171715;  /* stays dark in both themes (brand/contrast anchors) */
    --ink-solid-fg:#f3c27a; /* amber accent on --ink-solid */
    --ink-2:#3a3a36;
    --ink-3:#6d6d66;
    --ink-4:#a8a8a0;
    --line:#e7e5df;
    --line-2:#efede8;
    --teal:#0f6b6b;       /* primary scientific accent */
    --teal-ink:#083f3f;
    --teal-wash:#e6f0ef;
    --indigo:#3a3f8f;
    --indigo-wash:#eceef7;
    --amber:#b8601a;      /* AI highlights */
    --amber-wash:#fbefe0;
    --amber-grad:#fbf6ee; /* soft amber gradient end */
    --rose:#9a3a4d;
    --green:#2f6b3a;
    --warn:#b36610;
    --ok:#2f6b3a;
    --bad:#9a3a4d;
    --radius:10px;
    --radius-sm:6px;
    --shadow-sm: 0 1px 0 rgba(20,20,15,.04), 0 1px 2px rgba(20,20,15,.04);
    --shadow-md: 0 2px 4px rgba(20,20,15,.04), 0 8px 24px rgba(20,20,15,.06);
    --shadow-lg: 0 12px 40px rgba(20,20,15,.10), 0 2px 4px rgba(20,20,15,.04);
  }
  html[data-theme="dark"]{
    --bg:#141311;
    --surface:#1c1b18;
    --surface-2:#242220;
    --surface-strong:#262421;
    --ink:#f2f1ec;
    --ink-solid:#171715;     /* unchanged — brand contrast anchor */
    --ink-solid-fg:#f3c27a;  /* amber accent on --ink-solid */
    --ink-2:#cfcdc5;
    --ink-3:#9a988f;
    --ink-4:#6d6b64;
    --line:#33302b;
    --line-2:#2a2824;
    --teal:#2b9b9b;
    --teal-ink:#7dcaca;
    --teal-wash:rgba(15,107,107,.18);
    --indigo:#6a70b8;
    --indigo-wash:rgba(58,63,143,.18);
    --amber:#d88341;
    --amber-wash:rgba(184,96,26,.18);
    --amber-grad:#2a241b;
    --rose:#c06476;
    --green:#6fb074;
    --shadow-sm: 0 1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 2px 4px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3a3630;border:2px solid var(--bg)}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:#4a4640}
  html[data-theme="dark"] .chip.ok{background:rgba(47,107,58,.18);border-color:rgba(47,107,58,.4);color:#8ac493}
  html[data-theme="dark"] .chip.warn{background:rgba(184,96,26,.22);border-color:rgba(184,96,26,.45);color:#e6a56b}
  html[data-theme="dark"] .chip.bad{background:rgba(154,58,77,.22);border-color:rgba(154,58,77,.45);color:#df92a0}
  html[data-theme="dark"] .chip.ai{background:rgba(184,96,26,.2);border-color:rgba(184,96,26,.4);color:#e6a56b}
  html[data-theme="dark"] .chip.info{background:rgba(15,107,107,.22);border-color:rgba(15,107,107,.45);color:#7dcaca}
  html[data-theme="dark"] .btn.primary{background:#f2f1ec;color:#171715;border-color:#f2f1ec}
  html[data-theme="dark"] .btn.primary:hover{background:#e2e0d8}
  html[data-theme="dark"] .btn.ai{background:linear-gradient(180deg,var(--surface),var(--amber-grad));border-color:rgba(184,96,26,.4);color:#e6a56b}
  html[data-theme="dark"] .btn.ai:hover{background:var(--amber-grad)}
  html[data-theme="dark"] ::selection{background:rgba(216,131,65,.35);color:var(--ink)}
  html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{
    color:var(--ink); color-scheme:dark;
  }
  html[data-theme="dark"] .kbd{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  #root{min-height:100vh}
  button{font:inherit;color:inherit}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:"zero"}
  .serif{font-family:'Instrument Serif',serif;font-weight:400}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d9d7d1;border-radius:10px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#bfbdb6}
  ::-webkit-scrollbar-track{background:transparent}

  /* utility */
  .kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#fff;color:var(--ink-2)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;color:var(--ink-2)}
  .chip.ok{background:#eef5ef;border-color:#cfe2d0;color:#26522f}
  .chip.warn{background:#fbefe0;border-color:#eed5b1;color:#8a4a0d}
  .chip.bad{background:#f5e3e7;border-color:#e5c4cc;color:#7a2a3b}
  .chip.ai{background:var(--amber-wash);border-color:#eed5b1;color:#8a4a0d}
  .chip.info{background:var(--teal-wash);border-color:#c4dcd9;color:#0a4a4a}
  .dot{width:6px;height:6px;border-radius:999px;display:inline-block;background:currentColor}

  /* focus */
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--ink-solid);color:#f2f1ec;border-color:var(--ink-solid)}
  .btn.primary:hover{background:#2a2a27}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
  .btn.ai{background:linear-gradient(180deg,var(--surface),var(--amber-grad));border-color:#e9d5b4;color:#7a4210}
  .btn.ai:hover{background:var(--amber-grad)}
  .btn.sm{padding:5px 9px;font-size:12px}

  /* chat/ai gradient accents */
  .ai-border{position:relative}
  .ai-border::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#d7b07b,#0f6b6b 60%,#3a3f8f);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

  /* divider */
  hr.rule{border:0;border-top:1px solid var(--line);margin:0}

  /* table */
  table.data{width:100%;border-collapse:collapse;font-size:12.5px}
  table.data th, table.data td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2)}
  table.data th{font-weight:500;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);position:sticky;top:0}
  table.data tr:hover td{background:var(--surface-2)}
  table.data td.num{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum"}

  /* shared card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-title{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.005em}
  .card-sub{font-size:12px;color:var(--ink-3)}

  /* plot placeholder background */
  .plot-bg{background-image:
    linear-gradient(var(--line-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-2) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
    background-position: -1px -1px, -1px -1px;
  }
  .striped{background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,#fff 10px 20px)}

  /* skeleton / sweep animations */
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .sweep{position:relative;overflow:hidden}
  .sweep::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sweep 1.6s linear infinite}

  @keyframes pulseDot{0%,100%{opacity:.35}50%{opacity:1}}
  .thinking-dot{animation:pulseDot 1.2s ease-in-out infinite}
  .thinking-dot:nth-child(2){animation-delay:.15s}
  .thinking-dot:nth-child(3){animation-delay:.3s}

  /* fade in */
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fade-up{animation:fadeUp .3s ease}

  /* selection */
  ::selection{background:#f5e5c9;color:var(--ink)}
</style>
</head>
<body>
<script>
  // Apply theme before paint to avoid flash.
  (function(){
    try {
      var t = localStorage.getItem("seas-theme");
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch(e) {}
  })();
</script>
<div id="root"></div>
